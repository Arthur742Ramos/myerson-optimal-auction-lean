# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Myerson's Optimal Auction Theorem"
  description: >-
    A Lean formalization of Myerson's 1981 optimal auction design theorem in a
    single-parameter independent-private-values model with continuous type
    distributions. The formalization covers the regular case (nondecreasing
    virtual values): the virtual-surplus revenue identity and the theorem that
    allocating to the highest nonnegative virtual value maximizes expected
    revenue over all Bayesian incentive-compatible and interim individually
    rational mechanisms. Ironing for irregular distributions is out of scope.
    (Milestone M6 rewrites this description from the final Lean binders.)
  authors: ["Arthur Freitas Ramos", "David Barros Hulak", "Ruy Jose Guerra Barretto de Queiroz"]
  responsible_maintainers: ["Arthur Freitas Ramos", "David Barros Hulak", "Ruy Jose Guerra Barretto de Queiroz"]
  license: "BSD-3-Clause"

sources:
  - title: "Optimal Auction Design"
    authors: ["Roger B. Myerson"]
    type: "paper"
    location: "Mathematics of Operations Research 6(1), 58-73, 1981"
    relationship: "formalizes"
    author_endorsement: "not-contacted"

related_formalizations: []

classification:
